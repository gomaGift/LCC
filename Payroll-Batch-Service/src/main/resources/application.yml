spring:
  application:
        name: Payroll-Batch-Service


  datasource:
    url: jdbc:mysql://localhost:3306/mydatabase
    username: root
    password: goma
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    database-platform: org.hibernate.dialect.MySQL8Dialect
    hibernate:
      ddl-auto: update

  batch:
    job:
      enabled: false
    jdbc:
      initialize-schema: always


  # employee payroll pdf mail sender config
  mail:
    host: smtp.gmail.com
    port: 587
    username: username
    password: password
    properties:
      mail.smtp:
        auth: true
        starttls.enable: true

# Camunda external service config
camunda:
  bpm:
   admin-user:
          id: demo
          password: demo

   client:
     base-url: http://localhost:8080/rest-engine
     async-response-timeout: 100
     worker-id: Employee-Payroll




